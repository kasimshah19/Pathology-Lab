<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="200" height="200">
  <!-- Premium Dark Gradient Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Tech Ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#techGrad)" stroke-width="8" stroke-dasharray="10 20 60 20" opacity="0.6"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#techGrad)" stroke-width="4" stroke-dasharray="30 15 10 15" opacity="0.3"/>

  <!-- Medical Cross / Tech Nodes -->
  <path d="M200 60 L200 90 M200 310 L200 340 M60 200 L90 200 M310 200 L340 200" stroke="url(#techGrad)" stroke-width="12" stroke-linecap="round" />
  
  <circle cx="200" cy="60" r="8" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="200" cy="340" r="8" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="60" cy="200" r="8" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="340" cy="200" r="8" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Central Blood Drop -->
  <path d="M200 120 C 200 120, 140 190, 140 230 C 140 270, 170 300, 200 300 C 230 300, 260 270, 260 230 C 260 190, 200 120, 200 120 Z" fill="url(#dropGrad)" filter="url(#glow)"/>
  
  <!-- DNA / Tech Lines inside Drop -->
  <path d="M170 200 Q 200 230 230 190 M170 240 Q 200 270 230 230" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <circle cx="170" cy="200" r="4" fill="#ffffff"/>
  <circle cx="230" cy="190" r="4" fill="#ffffff"/>
  <circle cx="170" cy="240" r="4" fill="#ffffff"/>
  <circle cx="230" cy="230" r="4" fill="#ffffff"/>

</svg>
